name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout tag with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify clean synchronized release tag
        run: npm run release:guard -- --tag "${GITHUB_REF_NAME}"

      - name: Build and verify release assets
        run: npm run check:release

      - name: Upload immutable release assets
        uses: actions/upload-artifact@v7
        with:
          name: openqc-${{ github.ref_name }}
          path: |
            vsix/*.vsix
            vsix/*.vsix.sha256
            vsix/*.sbom.json
          if-no-files-found: error
          retention-days: 30

  publish-marketplace:
    name: Publish to VS Code Marketplace
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install pinned release tooling
        run: npm ci

      - name: Download verified release assets
        uses: actions/download-artifact@v8
        with:
          name: openqc-${{ github.ref_name }}
          path: vsix

      - name: Publish the verified VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "${VSCE_PAT}"
          mapfile -t vsix_files < <(find vsix -maxdepth 1 -type f -name '*.vsix' | sort)
          test "${#vsix_files[@]}" -eq 1
          (cd vsix && sha256sum --check "$(basename "${vsix_files[0]}").sha256")
          ./node_modules/.bin/vsce publish --packagePath "${vsix_files[0]}" -p "${VSCE_PAT}"

  finalize-github-release:
    name: Finalize GitHub Release
    needs: publish-marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download published release assets
        uses: actions/download-artifact@v8
        with:
          name: openqc-${{ github.ref_name }}
          path: vsix

      - name: Create GitHub Release last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t vsix_files < <(find vsix -maxdepth 1 -type f -name '*.vsix' | sort)
          test "${#vsix_files[@]}" -eq 1
          (cd vsix && sha256sum --check "$(basename "${vsix_files[0]}").sha256")
          gh release create "${GITHUB_REF_NAME}" \
            vsix/*.vsix \
            vsix/*.vsix.sha256 \
            vsix/*.sbom.json \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "OpenQC ${GITHUB_REF_NAME}"
